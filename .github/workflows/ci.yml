name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Fixture mode replays recorded responses, so neither job needs secrets: the values below are dummies.
env:
  ETG_MODE: fixture
  ALLOW_FIXTURE_MODE: "1"
  ETG_BASE_URL: https://api-sandbox.ratehawk.com
  SUPABASE_URL: http://localhost:54321
  SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key

jobs:
  # Types, unit tests, lint, production build and the browser tests.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ci

  # Lighthouse speed and accessibility targets, reported separately from the checks above.
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Lighthouse reuses the Chromium that Playwright installs (scripts/chrome-path.mjs).
      - run: npx playwright install --with-deps chromium
      - run: npm run ci:speed
